<svg xmlns="http://www.w3.org/2000/svg" width="760" height="56" viewBox="0 0 760 56" role="img" aria-label="tagline"><style>.t{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:19px;font-weight:600;fill:#d97757;letter-spacing:.6px;text-anchor:middle;opacity:0}.a{animation:cyc 10.5s ease-in-out infinite}.b{animation:cyc 10.5s ease-in-out 3.5s infinite}.c{animation:cyc 10.5s ease-in-out 7s infinite}.u{stroke:#d4a27f;stroke-width:2;stroke-linecap:round;transform-origin:380px 47px;animation:pulse 3.5s ease-in-out infinite}@keyframes cyc{0%{opacity:0;transform:translateY(9px)}5%{opacity:1;transform:translateY(0)}28%{opacity:1;transform:translateY(0)}33%{opacity:0;transform:translateY(-9px)}100%{opacity:0;transform:translateY(-9px)}}@keyframes pulse{0%,100%{transform:scaleX(.28);opacity:.35}50%{transform:scaleX(1);opacity:1}}</style><text class="t a" x="380" y="30">Cybersecurity &amp; Digital Forensics Student</text><text class="t b" x="380" y="30">Security Research Intern @ DSO National Labs</text><text class="t c" x="380" y="30">Always investigating, always building</text><line class="u" x1="320" y1="47" x2="440" y2="47"/></svg>
